<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم السحابية | كوزمتك المهندس</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; }</style>
</head>
<body class="p-3 sm:p-8">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- صندوق الإعدادات السحابية لـ GitHub -->
    <div class="bg-white p-5 rounded-3xl border border-pink-200 shadow-sm">
      <div class="flex items-center justify-between cursor-pointer" onclick="toggleConfig()">
        <div>
          <h2 class="text-sm sm:text-base font-extrabold text-gray-900">⚙ إعدادات ربط لوحة التحكم بـ GitHub</h2>
          <p class="text-xs text-gray-500 mt-0.5" id="configStatus">اضغط لإدخال مفتاح التحديث السحابي</p>
        </div>
        <span class="text-pink-600 font-bold text-xs sm:text-sm" id="configToggleText">إظهار</span>
      </div>

      <div id="configSection" class="hidden mt-4 pt-4 border-t border-gray-100 space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">اسم حسابك في GitHub (Username)</label>
          <input type="text" id="ghUser" placeholder="mohanadm2011" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500" dir="ltr">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">اسم المستودع (Repository Name)</label>
          <input type="text" id="ghRepo" value="kozmetik-almuhandis" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500" dir="ltr">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">مفتاح الوصول السري (GitHub Token)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500" dir="ltr">
        </div>
        <button onclick="saveConfig()" class="bg-pink-600 text-white font-bold px-5 py-2 rounded-xl text-xs hover:bg-pink-700">حفظ الإعدادات</button>
      </div>
    </div>

    <!-- الترويسة -->
    <div class="bg-white p-5 rounded-3xl border border-gray-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-gray-900">إدارة منتجات كوزمتك المهندس</h1>
        <p class="text-xs text-gray-500">إضافة صور متعددة، الأقسام، العروض، وحالة التوفر</p>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <a href="index.html" class="flex-1 sm:flex-initial text-center px-4 py-2 border border-gray-300 rounded-xl text-xs font-bold text-gray-700 hover:bg-gray-50">عرض المتجر</a>
        <button onclick="fetchLatestFromGitHub()" class="flex-1 sm:flex-initial px-4 py-2 bg-gray-100 text-gray-800 rounded-xl text-xs font-bold hover:bg-gray-200">🔄 تحديث</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- نموذج إضافة / تعديل منتج -->
      <div class="bg-white p-5 sm:p-6 rounded-3xl border border-gray-200 shadow-sm h-fit">
        <h2 id="formTitle" class="text-base font-bold text-gray-900 mb-4 pb-2 border-b">إضافة منتج جديد</h2>
        <form id="productForm" onsubmit="handleProductSubmit(event)" class="space-y-3.5">
          <input type="hidden" id="prodId">

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">اسم المنتج *</label>
            <input type="text" id="prodName" required placeholder="مثال: سيروم فيتامين سي" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">القسم / التصنيف *</label>
            <select id="prodCategory" required class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500 bg-white">
              <option value="العناية بالبشره">العناية بالبشره</option>
              <option value="العنايه بالشعر">العنايه بالشعر</option>
              <option value="العنايه بالجسم">العنايه بالجسم</option>
              <option value="المكياج">المكياج</option>
              <option value="اكسسوارات">اكسسوارات</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">السعر بالدينار العراقي *</label>
            <input type="number" id="prodPrice" required placeholder="15000" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500">
          </div>

          <div class="p-3 bg-pink-50/60 rounded-xl border border-pink-200 flex items-center justify-between">
            <label for="prodOutOfStock" class="text-xs font-bold text-gray-800 cursor-pointer">
              وضع المنتج كـ <span class="text-pink-700 font-extrabold">"غير متوفر"</span>
            </label>
            <input type="checkbox" id="prodOutOfStock" class="w-4 h-4 accent-pink-600 rounded cursor-pointer">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">شارة العرض (فوق الصورة) - اختياري</label>
            <input type="text" id="prodBadge" placeholder="مثال: 5+1 مجاناً" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">الألوان (اختياري - اتركه فارغاً إذا كان بدون ألوان)</label>
            <input type="text" id="prodColors" placeholder="مثال: أحمر, وردي, نيود" class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500">
          </div>

          <!-- روابط الصور المتعددة -->
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">روابط صور المنتج (صورة واحدة أو أكثر) *</label>
            <textarea id="prodImages" rows="3" required placeholder="ضع رابط الصورة الأولى هنا...
إذا عندك صور إضافية ضع كل رابط في سطر جديد أو افصل بينها بفاصلة" class="w-full px-3 py-2 text-xs border rounded-xl outline-none focus:border-pink-500" dir="ltr"></textarea>
            <span class="text-[10px] text-gray-400">يمكنك وضع رابط واحد أو عدة روابط صور؛ لتسمح للزبون بالتمرير بينها.</span>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">وصف المنتج الكامل *</label>
            <textarea id="prodDesc" rows="3" required placeholder="اكتب فوائد واستخدامات المنتج بالتفصيل ليقرأها الزبون في نافذة المنتج..." class="w-full px-3 py-2 text-sm border rounded-xl outline-none focus:border-pink-500"></textarea>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="submit" id="saveBtn" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
              حفظ ومزامنة
            </button>
            <button type="button" onclick="resetForm()" class="px-3 py-2.5 border rounded-xl text-xs font-bold">إلغاء</button>
          </div>
        </form>
      </div>

      <!-- قائمة المنتجات الحالية -->
      <div class="lg:col-span-2 space-y-3">
        <h2 class="text-base font-bold text-gray-900">المنتجات المنشورة (<span id="prodCount">0</span>)</h2>
        <div id="adminList" class="space-y-2.5">
          <div class="p-8 text-center text-gray-400 bg-white rounded-2xl border">جاري تحميل المنتجات...</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentProducts = [];
    let fileSha = "";

    function utf8ToBase64(str) {
      return window.btoa(unescape(encodeURIComponent(str)));
    }
    function base64ToUtf8(str) {
      return decodeURIComponent(escape(window.atob(str.replace(/\s/g, ''))));
    }

    function toggleConfig() {
      const sec = document.getElementById('configSection');
      sec.classList.toggle('hidden');
      document.getElementById('configToggleText').innerText = sec.classList.contains('hidden') ? 'إظهار' : 'إخفاء';
    }

    function loadConfig() {
      const user = localStorage.getItem('km_gh_user') || '';
      const repo = localStorage.getItem('km_gh_repo') || 'kozmetik-almuhandis';
      const token = localStorage.getItem('km_gh_token') || '';

      document.getElementById('ghUser').value = user;
      document.getElementById('ghRepo').value = repo;
      document.getElementById('ghToken').value = token;

      if (user && token) {
        document.getElementById('configStatus').innerText = `✅ اللوحة متصلة بحسابك: ${user}`;
        document.getElementById('configStatus').className = "text-xs text-emerald-600 font-bold mt-0.5";
      }
    }

    function saveConfig() {
      const user = document.getElementById('ghUser').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!user || !token) {
        alert('يرجى ملء اسم المستخدم ورمز Token');
        return;
      }

      localStorage.setItem('km_gh_user', user);
      localStorage.setItem('km_gh_repo', repo);
      localStorage.setItem('km_gh_token', token);

      alert('تم حفظ الإعدادات بنجاح!');
      toggleConfig();
      loadConfig();
      fetchLatestFromGitHub();
    }

    async function fetchLatestFromGitHub() {
      const user = (localStorage.getItem('km_gh_user') || '').trim();
      const repo = (localStorage.getItem('km_gh_repo') || 'kozmetik-almuhandis').trim();
      const token = (localStorage.getItem('km_gh_token') || '').trim();

      const adminList = document.getElementById('adminList');

      if (!user || !token) {
        adminList.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 p-6 rounded-2xl text-center text-amber-800 text-sm">
            يرجى فتح <strong>إعدادات الربط السحابي</strong> في الأعلى وإدخال بيانات GitHub.
          </div>`;
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.status === 401) throw new Error('رمز Token غير صالح أو تم إلغاؤه، يرجى تجديده.');
        if (res.status === 404) throw new Error('ملف products.json غير موجود في المستودع.');
        if (!res.ok) throw new Error(`خطأ سيرفر: ${res.status}`);

        const data = await res.json();
        fileSha = data.sha;
        currentProducts = JSON.parse(base64ToUtf8(data.content));
        renderAdminList();
      } catch (e) {
        adminList.innerHTML = `
          <div class="bg-red-50 border border-red-200 p-5 rounded-2xl text-center text-red-700 text-xs sm:text-sm font-bold">
            ⚠️ ${e.message}
          </div>`;
      }
    }

    function renderAdminList() {
      const container = document.getElementById('adminList');
      const count = document.getElementById('prodCount');
      count.innerText = currentProducts.length;
      container.innerHTML = '';

      if (currentProducts.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-gray-400 bg-white rounded-2xl border">لا توجد منتجات.</div>`;
        return;
      }

      currentProducts.forEach((p, idx) => {
        const imgs = Array.isArray(p.images) && p.images.length > 0 ? p.images : (p.image ? [p.image] : ['https://placehold.co/100x100?text=صورة']);
        const item = document.createElement('div');
        item.className = "bg-white p-3.5 rounded-2xl border border-gray-200 flex items-center justify-between gap-3 shadow-sm";
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${imgs[0]}" class="w-12 h-12 object-cover rounded-xl border">
            <div>
              <div class="flex items-center gap-2">
                <h4 class="font-bold text-gray-900 text-sm">${p.name}</h4>
                <span class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded">${p.category || 'العناية بالبشره'}</span>
                ${p.outOfStock ? '<span class="bg-pink-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">غير متوفر</span>' : ''}
                ${imgs.length > 1 ? `<span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-1.5 py-0.5 rounded">${imgs.length} صور</span>` : ''}
              </div>
              <p class="text-xs text-gray-500 font-semibold mt-0.5">
                ${Number(p.price).toLocaleString()} د.ع ${p.colors?.length ? `| الألوان: ${p.colors.join(', ')}` : ''}
              </p>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="editItem(${idx})" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-xs font-bold rounded-lg">تعديل</button>
            <button onclick="deleteItem(${idx})" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-lg">حذف</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    async function syncToGitHub(updatedList) {
      const user = (localStorage.getItem('km_gh_user') || '').trim();
      const repo = (localStorage.getItem('km_gh_repo') || 'kozmetik-almuhandis').trim();
      const token = (localStorage.getItem('km_gh_token') || '').trim();
      const saveBtn = document.getElementById('saveBtn');

      saveBtn.disabled = true;
      saveBtn.innerText = "جاري النشر والمزامنة...";

      try {
        const jsonString = JSON.stringify(updatedList, null, 2);
        const contentBase64 = utf8ToBase64(jsonString);

        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update products catalog',
            content: contentBase64,
            sha: fileSha
          })
        });

        if (!res.ok) throw new Error();

        const resData = await res.json();
        fileSha = resData.content.sha;
        currentProducts = updatedList;
        renderAdminList();
        resetForm();
        alert('تم تحديث ونشر المتجر بنجاح! 🚀');
      } catch (e) {
        alert('حدث خطأ أثناء المزامنة، تأكد من الاتصال وصلاحيات Token');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "حفظ ومزامنة";
      }
    }

    function handleProductSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value;
      const name = document.getElementById('prodName').value.trim();
      const category = document.getElementById('prodCategory').value;
      const price = parseInt(document.getElementById('prodPrice').value);
      const outOfStock = document.getElementById('prodOutOfStock').checked;
      const badge = document.getElementById('prodBadge').value.trim();
      
      const rawColors = document.getElementById('prodColors').value.trim();
      const colors = rawColors ? rawColors.split(',').map(c => c.trim()).filter(Boolean) : [];

      // معالجة الصور المتعددة
      const rawImages = document.getElementById('prodImages').value.trim();
      const images = rawImages ? rawImages.split(/[\n,]+/).map(u => u.trim()).filter(Boolean) : [];
      const image = images[0] || '';

      const description = document.getElementById('prodDesc').value.trim();

      let newList = [...currentProducts];

      if (id) {
        const idx = newList.findIndex(p => p.id == id);
        if (idx > -1) {
          newList[idx] = { ...newList[idx], name, category, price, outOfStock, badge, colors, image, images, description };
        }
      } else {
        newList.unshift({
          id: Date.now(),
          name, category, price, outOfStock, badge, colors, image, images, description
        });
      }

      syncToGitHub(newList);
    }

    function editItem(idx) {
      const p = currentProducts[idx];
      document.getElementById('formTitle').innerText = "تعديل المنتج";
      document.getElementById('prodId').value = p.id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.category || 'العناية بالبشره';
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodOutOfStock').checked = p.outOfStock || false;
      document.getElementById('prodBadge').value = p.badge || '';
      document.getElementById('prodColors').value = (p.colors || []).join(', ');

      const imgs = Array.isArray(p.images) && p.images.length > 0 ? p.images : (p.image ? [p.image] : []);
      document.getElementById('prodImages').value = imgs.join('\n');

      document.getElementById('prodDesc').value = p.description || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(idx) {
      if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
        let newList = [...currentProducts];
        newList.splice(idx, 1);
        syncToGitHub(newList);
      }
    }

    function resetForm() {
      document.getElementById('formTitle').innerText = "إضافة منتج جديد";
      document.getElementById('productForm').reset();
      document.getElementById('prodId').value = '';
      document.getElementById('prodOutOfStock').checked = false;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      fetchLatestFromGitHub();
    });
  </script>
</body>
</html>
